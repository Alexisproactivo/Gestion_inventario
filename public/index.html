<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Gestión de Inventario | PostgreSQL</title>
  <!-- Tailwind CSS CDN para maquetación rápida y responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Encabezado -->
    <header class="flex flex-col md:flex-row md:items-center md:justify-between pb-6 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white flex items-center gap-3">
          📦 Inventario en Vivo
          <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-0.5 rounded-full font-medium">PostgreSQL Activo</span>
        </h1>
        <p class="text-slate-400 text-sm mt-1">Gestión de stock sincronizada en tiempo real con Neon Cloud</p>
      </div>

      <button id="btn-abrir-modal" class="inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-lg font-medium transition shadow-lg shadow-indigo-600/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Nuevo Producto
      </button>
    </header>

    <!-- Tarjetas de Métricas -->
    <section class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-8">
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Total Referencias</p>
        <h3 id="stat-total" class="text-3xl font-extrabold text-white mt-2">--</h3>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Unidades en Stock</p>
        <h3 id="stat-stock" class="text-3xl font-extrabold text-emerald-400 mt-2">--</h3>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/60 rounded-xl p-5">
        <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">Valor Estimado</p>
        <h3 id="stat-valor" class="text-3xl font-extrabold text-indigo-400 mt-2">S/ --</h3>
      </div>
    </section>

    <!-- Tabla Responsiva de Productos -->
    <main class="bg-slate-800/40 border border-slate-700/60 rounded-xl overflow-hidden shadow-xl">
      <div class="p-4 sm:p-5 border-b border-slate-800 flex justify-between items-center">
        <h2 class="font-semibold text-lg text-white">Catálogo de Productos</h2>
        <span id="badge-contador" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">Cargando...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800/80 text-xs uppercase tracking-wider text-slate-400 border-b border-slate-700/60">
            <tr>
              <th scope="col" class="py-3.5 px-4 font-semibold">ID</th>
              <th scope="col" class="py-3.5 px-4 font-semibold">Producto</th>
              <th scope="col" class="py-3.5 px-4 font-semibold">Categoría</th>
              <th scope="col" class="py-3.5 px-4 font-semibold">Precio</th>
              <th scope="col" class="py-3.5 px-4 font-semibold">Stock</th>
              <th scope="col" class="py-3.5 px-4 font-semibold">Estado</th>
              <th scope="col" class="py-3.5 px-4 font-semibold text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-productos" class="divide-y divide-slate-800">
            <!-- Rellenado dinámicamente por JavaScript -->
          </tbody>
        </table>
      </div>
    </main>

  </div>

  <!-- Modal para Agregar Producto -->
  <div id="modal-producto" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl relative">
      <div class="flex justify-between items-center pb-4 border-b border-slate-700">
        <h3 class="text-lg font-bold text-white">Registrar Nuevo Producto</h3>
        <button id="btn-cerrar-modal" class="text-slate-400 hover:text-white transition">✕</button>
      </div>

      <form id="form-nuevo-producto" class="space-y-4 mt-4">
        <input type="hidden" id="input-id" value="" />
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Nombre</label>
          <input type="text" id="input-nombre" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Ej: Monitor Gamer 27" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Categoría</label>
          <input type="text" id="input-categoria" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Ej: Tecnología" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Precio (S/)</label>
            <input type="number" step="0.01" min="0" id="input-precio" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="0.00" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Stock</label>
            <input type="number" min="0" id="input-stock" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="0" />
          </div>
        </div>

        <div class="pt-3 flex justify-end gap-2">
          <button type="button" id="btn-cancelar" class="px-4 py-2 rounded-lg text-sm text-slate-300 hover:bg-slate-700 transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-semibold text-white transition shadow-md">Guardar en PostgreSQL</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
