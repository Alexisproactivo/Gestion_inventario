<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acceso al Sistema | Gestión de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body
    class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 lg:p-8 font-sans antialiased"
  >
    <div
      class="w-full max-w-5xl h-[650px] bg-slate-900/80 border border-slate-800/80 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row backdrop-blur-xl"
    >
      <div
        class="relative w-full md:w-1/2 h-48 md:h-full overflow-hidden bg-slate-950 flex flex-col justify-between p-8 border-b md:border-b-0 md:border-r border-slate-800/60"
      >
        <video
          autoplay
          loop
          muted
          playsinline
          class="absolute inset-0 w-full h-full object-cover opacity-60 pointer-events-none"
        >
          <source
            src="bg-login.mp4"
          />
        </video>

        <div
          class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent"
        ></div>

        <div class="relative z-10">
          <div
            class="inline-flex items-center gap-2 bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full text-indigo-400 text-xs font-semibold tracking-wide"
          > 
          </div>
        </div>

        <div class="relative z-10 hidden md:block">
          <h2 class="text-2xl font-bold text-white leading-snug">
            Control logístico centralizado en la nube.
          </h2>
          <p class="text-xs text-slate-400 mt-2 leading-relaxed">
            Base de datos relacional PostgreSQL con replicación en tiempo real y
            arquitectura de micro-servicios escalables.
          </p>
        </div>
      </div>

      <div
        class="w-full md:w-1/2 h-full flex flex-col justify-center px-8 sm:px-12 py-10 bg-slate-900/40"
      >
        <div class="max-w-sm w-full mx-auto">
          <div class="mb-8">
            <h1 class="text-2xl font-extrabold text-white tracking-tight">
              Iniciar Sesión
            </h1>
            <p class="text-sm text-slate-400 mt-1">
              Accede con tus credenciales de operador
            </p>
          </div>

          <div class="mb-6 flex justify-center">
          <div
            id="g_id_onload"
            data-client_id="873421709361-vlbcuc50h89891i2tvpioijfg1p4rt2f.apps.googleusercontent.com"
            data-context="signin"
            data-ux_mode="popup"
            data-callback="manejarCredencialGoogle"
            data-auto_prompt="false"
          ></div>

          <div
            class="g_id_signin w-full"
            data-type="standard"
            data-shape="rectangular"
            data-theme="filled_black"
            data-text="signin_with"
            data-size="large"
            data-logo_alignment="left"
          ></div>
        </div>

         <div class="flex items-center my-6">
          <div class="flex-1 border-t border-slate-800"></div>
          <span class="px-3 text-xs text-slate-500 uppercase tracking-wider font-semibold whitespace-nowrap">
            o con email
          </span>
          <div class="flex-1 border-t border-slate-800"></div>
        </div>

          <form id="form-login" class="space-y-4">
            <div>
              <label
                class="block text-xs font-semibold uppercase text-slate-400 mb-1.5"
                >Correo Electrónico</label
              >
              <input
                type="email"
                id="input-email"
                required
                placeholder="admin@empresa.com"
                class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
              />
            </div>

            <div>
              <label
                class="block text-xs font-semibold uppercase text-slate-400 mb-1.5"
                >Contraseña</label
              >
              <input
                type="password"
                id="input-password"
                required
                placeholder="••••••••"
                class="w-full bg-slate-950/70 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
              />
            </div>

            <button
              type="submit"
              class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl text-sm transition duration-200 shadow-lg shadow-indigo-600/25"
            >
              Ingresar al Panel
            </button>
          </form>

          <p class="text-center text-xs text-slate-500 mt-6">
            Acceso protegido por PostgreSQL Role Management
          </p>
        </div>
      </div>
    </div>
  <script>
    // Esta función se ejecuta automáticamente cuando el usuario selecciona su cuenta de Google
    async function manejarCredencialGoogle(response) {
      console.log("Token JWT recibido de Google:", response.credential);

      try {
        // Enviamos el token al backend de Express para verificarlo y guardarlo en Neon
        const peticion = await fetch('/api/auth/google', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ token: response.credential })
        });

        const data = await peticion.json();

        if (peticion.ok) {
          // Guardamos los datos del usuario en el navegador
          localStorage.setItem('usuario', JSON.stringify(data.usuario));
          // Redirigimos al catálogo principal
          window.location.href = '/index.html';
        } else {
          alert('Error al iniciar sesión: ' + data.mensaje);
        }
      } catch (error) {
        console.error('Error de red al autenticar:', error);
        alert('No se pudo conectar con el servidor.');
      }
    }
  </script>
</body>
</html>
